[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gentifi-profile"
version = "0.1.0"
description = "Validator and reference MCP server for the Gentifi Business Profile specification (draft)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
server = ["mcp>=2.0"]
dev = ["mcp>=2.0", "pytest>=8"]

[project.scripts]
gentifi-validate = "gentifi_profile.cli:main"
gentifi-mcp = "gentifi_profile.server:main"
gentifi-relay = "gentifi_profile.relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gentifi_profile = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
